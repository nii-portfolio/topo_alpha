topology:
  correlation_thresholds: [0.3, 0.5, 0.7, 0.9]
  persistence_dimensions: [0, 1]
  max_edge_length: 2.0
  ripser_modulus: 2
  
graph:
  gat_heads: 8
  gat_layers: 3
  hidden_dim: 64
  dropout: 0.1
  learning_rate: 0.001

regime:
  lookback_windows: [20, 60, 120]
  min_regime_persistence: 10
  
risk:
  beta_confidence: 0.95
  max_beta_deviation: 0.1
  target_portfolio_beta: 0.0
  
execution:
  rebalance_threshold: 0.05
  max_position_size: 0.1
  slippage_model: "quadratic"